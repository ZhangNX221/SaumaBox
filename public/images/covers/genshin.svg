    <polygon points="0,-12 4,-3 12,0 4,3 0,12 -4,3 -12,0 -4,-3" fill="#ffffff" opacity="0.95"/>
  </g>

  <rect x="36" y="475" width="110" height="22" rx="11" fill="rgba(255,255,255,0.12)" />
  <text x="91" y="490" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">OPEN WORLD</text>

  <text x="36" y="525" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
