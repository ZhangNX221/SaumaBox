<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a20" />
      <stop offset="50%" stop-color="#4a154b" />
      <stop offset="100%" stop-color="#100612" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="dither" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none" />
      <circle cx="2" cy="2" r="0.8" fill="rgba(255,255,255,0.08)" />
      <circle cx="5" cy="5" r="0.8" fill="rgba(255,255,255,0.08)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg)" />
  <rect width="400" height="600" fill="url(#glow)" />
  <rect width="400" height="600" fill="url(#dither)" />

  <!-- Geometric Accents -->
  <rect x="20" y="20" width="360" height="560" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <line x1="20" y1="80" x2="380" y2="80" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <line x1="20" y1="460" x2="380" y2="460" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Top Bar -->
  <rect x="36" y="38" width="80" height="24" rx="12" fill="rgba(0,0,0,0.5)" stroke="#f43f5e" stroke-width="1" />
  <text x="76" y="54" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">PC GAME</text>
  
  <text x="364" y="55" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="end">2019</text>

  <!-- Central Graphic / Icon -->
  <g transform="translate(200, 260) scale(2.2)">
    <g transform="translate(-16, -16)"><path d="M12 2c-.5 2.5-3 4-3 7 0 2.8 2.2 5 5 5s5-2.2 5-5c0-4-3.5-5.5-4-7zm-1 9c-.5 0-1-.5-1-1 0-1 1-2 2-2.5 0 1.5-.5 3.5-1 3.5z" fill="#ffffff" opacity="0.9"/></g>
  </g>

  <!-- Title & Meta Area -->
  <rect x="36" y="475" width="100" height="22" rx="11" fill="rgba(255,255,255,0.12)" />
  <text x="86" y="490" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">ULTIMATE ED</text>

  <text x="36" y="525" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
    Far Cry New Dawn
  </text>
  <text x="36" y="550" fill="rgba(255,255,255,0.65)" font-family="'Outfit', sans-serif" font-size="13" font-weight="500">
    Ubisoft Montreal • Ubisoft
  </text>
</svg>