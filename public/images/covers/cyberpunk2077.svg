  <rect x="36" y="38" width="80" height="24" rx="12" fill="rgba(0,0,0,0.5)" stroke="#fcee0a" stroke-width="1" />
  <text x="76" y="54" fill="#fcee0a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">PC GAME</text>
  
  <text x="364" y="55" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="end">2020</text>

