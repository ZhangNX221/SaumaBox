  <g transform="translate(200, 260) scale(2.2)">
    <g transform="translate(-16, -16)" fill="currentColor"><path d="M7 6h10a5 5 0 0 1 5 5v3a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5v-3a5 5 0 0 1 5-5zm2 5H7v2h2v2h2v-2h2v-2h-2V9H9v2zm8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="#ffffff" opacity="0.9"/></g>
