<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a0a" />
      <stop offset="60%" stop-color="#541717" />
      <stop offset="100%" stop-color="#120505" />
    </linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111115" />
      <stop offset="60%" stop-color="#18181d" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </radialGradient>
    <pattern id="dither" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none" />
      <circle cx="2" cy="2" r="0.8" fill="rgba(255,255,255,0.06)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)" />
  <rect width="500" height="500" fill="url(#dither)" />

  <!-- Vinyl Record Effect Behind Glass -->
  <circle cx="250" cy="210" r="140" fill="url(#vinyl)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <circle cx="250" cy="210" r="115" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="250" cy="210" r="90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="250" cy="210" r="65" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <circle cx="250" cy="210" r="35" fill="#f43f5e" opacity="0.9" />
  <circle cx="250" cy="210" r="10" fill="#09090b" />

  <!-- Central Icon inside vinyl or over -->
  <g transform="translate(250, 210) scale(1.5)">
    <g transform="translate(-16, -16)"><path d="M12 2c-.5 2.5-3 4-3 7 0 2.8 2.2 5 5 5s5-2.2 5-5c0-4-3.5-5.5-4-7zm-1 9c-.5 0-1-.5-1-1 0-1 1-2 2-2.5 0 1.5-.5 3.5-1 3.5z" fill="#ffffff" opacity="0.9"/></g>
  </g>

  <!-- Frame & Border -->
  <rect x="20" y="20" width="460" height="460" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Badge Top -->
  <rect x="36" y="36" width="90" height="24" rx="12" fill="rgba(0,0,0,0.6)" stroke="#f43f5e" stroke-width="1" />
  <text x="81" y="52" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">J-ROCK HIT</text>
  <text x="464" y="53" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="end">2019</text>

  <!-- Audio Wave Bars -->
  <g transform="translate(36, 360)">
    <rect x="0" y="8" width="4" height="24" rx="2" fill="#f43f5e" opacity="0.8" />
    <rect x="8" y="2" width="4" height="30" rx="2" fill="#f43f5e" opacity="0.9" />
    <rect x="16" y="14" width="4" height="18" rx="2" fill="#f43f5e" opacity="0.7" />
    <rect x="24" y="0" width="4" height="32" rx="2" fill="#f43f5e" />
    <rect x="32" y="6" width="4" height="26" rx="2" fill="#f43f5e" opacity="0.85" />
    <rect x="40" y="12" width="4" height="20" rx="2" fill="#f43f5e" opacity="0.7" />
  </g>

  <!-- Title & Artist -->
  <text x="36" y="425" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
    Gurenge
  </text>
  <text x="36" y="452" fill="rgba(255,255,255,0.75)" font-family="'Outfit', sans-serif" font-size="14" font-weight="500">
    LiSA • Leo-Nine
  </text>
</svg>