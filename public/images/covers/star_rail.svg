  <rect x="36" y="475" width="110" height="22" rx="11" fill="rgba(255,255,255,0.12)" />
  <text x="91" y="490" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">TURN-BASED RPG</text>

