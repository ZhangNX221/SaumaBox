  <text x="84" y="54" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">MOBILE</text>
  
  <text x="364" y="55" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="end">2023</text>

