name: saumabox

services:
  saumabox:
    container_name: saumabox
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if [ ! -f /app/server/index.js ]; then
          echo "Downloading SaumaBox bundle from GitHub Release v0.5.2..."
          node -e "fetch('https://github.com/ZhangNX221/SaumaBox/releases/download/v0.5.2/saumabox.tar.gz', { redirect: 'follow' }).then(r => { if (!r.ok) throw new Error(r.statusText); return r.arrayBuffer(); }).then(b => require('fs').writeFileSync('/tmp/sauma.tar.gz', Buffer.from(b)))"
          echo "Extracting bundle..."
          tar -xzf /tmp/sauma.tar.gz -C /app
          rm -f /tmp/sauma.tar.gz
        fi
        if [ ! -d /app/node_modules/express ]; then
          echo "Installing dependencies..."
          cd /app && npm install --omit=dev
        fi
        echo "Starting SaumaBox on port 3000..."
        cd /app && exec node server/index.js
    ports:
      - "3088:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - type: bind
        source: /DATA/AppData/saumabox/app
        target: /app
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      icon: https://files.catbox.moe/sp0h63.png
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_us: SaumaBox WebUI HTTP Port
      volumes:
        - container: /app
          description:
            en_us: SaumaBox Application & Data Directory

x-casaos:
  architectures:
    - amd64
    - arm64
  author: ZhangNX221
  category: Entertainment
  description:
    en_us: SaumaBox — Modern Self-Hosted Personal Media Catalog & Archiving System for Games, Cinema & Music (Node.js, Express, SQLite, Vanilla JS)
  developer: SaumaDev
  icon: https://files.catbox.moe/sp0h63.png
  index: /
  is_uncontrolled: false
  main: saumabox
  port_map: "3088"
  scheme: http
  title:
    en_us: SaumaBox

